name: POSTLAIN Support Tests

on:
  push:
    branches:
      - main
      - feature/postlain-ai-phase-1
      - feature/community-assistant-v2
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: |
          npm install
          npm test
