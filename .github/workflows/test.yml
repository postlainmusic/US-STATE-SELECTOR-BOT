name: POSTLAIN Support Tests

on:
  push:
    branches:
      - main
      - feature/postlain-ai-phase-1
      - feature/community-assistant-v2
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
      - name: Run tests
        run: |
          npm install
          npm install --prefix voice-engine --omit=dev --no-audit --no-fund
          node --check Src/index.js
          node --check Src/gateway.js
          node --check Src/wordchain-core.js
          node --check Src/support/engine.js
          node --check scripts/register-commands.js
          node --check Src/voice.js
          node --check voice-engine/src/server.js
          npm test
